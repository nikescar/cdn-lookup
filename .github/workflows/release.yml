on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  RUST_VERSION: 1.88.0
  BIN_NAME: "cdn-lookup"

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    # By default, runs on Ubuntu, otherwise, override with the desired os
    runs-on: ${{ matrix.platform.os || 'ubuntu-22.04' }}
    strategy:
      matrix:
        # Set platforms you want to build your binaries on
        platform:
          # Linux
          - name: Linux x86_64
            target: x86_64-unknown-linux-musl
            build-args: "--release"

          - name: Linux x86
            target: i686-unknown-linux-musl
            build-args: "--release"

          - name: Linux aarch64
            target: aarch64-unknown-linux-musl
            build-args: "--release"

          #- name: Linux armv7hf
          #  target: armv7-unknown-linux-musleabihf
          #  build-args: "--release"

          #- name: Linux armv6
          #  target: arm-unknown-linux-musleabihf
          #  build-args: "--release"

          #- name: Freebsd x86_64
          #  target: x86_64-unknown-freebsd
          #  build-args: "--release"

          #- name: Freebsd x86
          #  target: i686-unknown-freebsd
          #  build-args: "--release"

          #- name: Android aarch64
          #  target: aarch64-linux-android
          #  build-args: "--release"

          #- name: Android armv7
          #  target: armv7-linux-androideabi
          #  build-args: "--release"

          #- name: Linux mips
          #  target: mips-unknown-linux-musl

          #- name: Linux mips64
          #  target: mips64-unknown-linux-muslabi64

          # Mac OS
          - name: MacOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            build-args: "--release"

          - name: MacOS aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            build-args: "--release"

          # - name: iOS x86_64
          #  target: x86_64-apple-ios

          #- name: iOS aarch64
          #  target: aarch64-apple-ios

          # Windows
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            build-args: "--profile release-with-symbols"

          - name: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            build-args: "--profile release-with-symbols"

    steps:
      - name: Install package for linux
        if: contains(matrix.platform.target, 'linux')
        run: sudo apt install musl-tools libssl-dev pkg-config

      - name: Install package for Android
        if: contains(matrix.platform.target, 'android')
        run: sudo apt install android-libunwind android-libunwind-dev  libunwind-dev

      - name: Set up JDK 17
        if: contains(matrix.platform.target, 'android')
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: contains(matrix.platform.target, 'android')
        uses: android-actions/setup-android@v3

      - name: Checkout Git repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install OpenSSL for macOS
        if: contains(matrix.platform.target, 'apple-darwin')
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      # Linux & Windows
      - name: Install rust toolchain for Linux
        uses: actions-rs/toolchain@v1
        with:
          # We setup Rust toolchain and the desired target
          profile: minimal
          toolchain: "${{ env.RUST_VERSION }}"
          override: true
          target: ${{ matrix.platform.target }}
          components: rustfmt, clippy

      - name: Install package for Android
        if: contains(matrix.platform.target, 'android')
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Show command used for Cargo
        run: |
          echo "cargo command is: ${{ env.CARGO }}"
          echo "target flag is: ${{ env.BUILD_ARGS }}"

      - name: Build ${{ matrix.platform.name }} binary
        uses: actions-rs/cargo@v1
        # We use cross-rs if not running on x86_64 architecture on Linux
        with:
          command: build
          use-cross: ${{ !contains(matrix.platform.target, 'x86_64') || contains(matrix.platform.target, 'freebsd') }}
          args: ${{ matrix.platform.build-args }} --package ${{ env.BIN_NAME }} --target ${{ matrix.platform.target }}

      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          # Finally, we store the binary as GitHub artifact for later usage
          name: ${{ env.BIN_NAME }}-${{ matrix.platform.target }}
          path: target/${{ matrix.platform.target }}/release${{ contains(matrix.platform.target, 'windows') && '-with-symbols' || '' }}/${{ env.BIN_NAME }}${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }}
          retention-days: 1

  build-bsd:
    name: Build - ${{ matrix.platform.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - name: FreeBSD x86_64
            os: freebsd
            architecture: x86-64
            version: '14.2'
            target: x86_64-unknown-freebsd

          - name: OpenBSD x86_64
            os: openbsd
            architecture: x86-64
            version: '7.9'
            target: x86_64-unknown-openbsd

          - name: OpenBSD aarch64
            os: openbsd
            architecture: arm64
            version: '7.9'
            target: aarch64-unknown-openbsd

          - name: NetBSD x86_64
            os: netbsd
            architecture: x86-64
            version: '10.1'
            target: x86_64-unknown-netbsd

          - name: NetBSD aarch64
            os: netbsd
            architecture: arm64
            version: '10.1'
            target: aarch64-unknown-netbsd

    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Start ${{ matrix.platform.os }} VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: ${{ matrix.platform.os }}
          architecture: ${{ matrix.platform.architecture }}
          version: ${{ matrix.platform.version }}
          memory: 5G
          cpu_count: 4
          sync_files: runner-to-vm

      - name: Install packages on ${{ matrix.platform.os }}
        shell: cpa.sh {0}
        run: |
          if [ "${{ matrix.platform.os }}" = "freebsd" ]; then
            sudo pkg install -y git protobuf llvm15
          elif [ "${{ matrix.platform.os }}" = "netbsd" ]; then
            sudo pkgin -y install git curl clang jq
          elif [ "${{ matrix.platform.os }}" = "openbsd" ]; then
            sudo pkg_add rust
          fi

      - name: Install Rust on ${{ matrix.platform.os }}
        if: matrix.platform.os != 'openbsd'
        shell: cpa.sh {0}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustc --version
          cargo --version

      - name: Build on ${{ matrix.platform.os }}
        shell: cpa.sh {0}
        run: |
          if [ "${{ matrix.platform.os }}" != "openbsd" ]; then
            source $HOME/.cargo/env
            export CC=clang
            export CXX=clang++
          fi
          export CARGO_TERM_COLOR=always
          cargo build --release --package ${{ env.BIN_NAME }} --target ${{ matrix.platform.target }}

      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.platform.target }}
          path: target/release/${{ env.BIN_NAME }}
          retention-days: 1

  release:
    name: Release
    needs: [ build, build-bsd ]
    # We run the release job only if a tag starts with 'v' letter
    if: startsWith( github.ref, 'refs/tags/v' )
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Download all artifacts
      - uses: actions/download-artifact@v4.1.7
        with:
          path: artifacts

      - name: list artifacts
        run: |
          find artifacts/
          mkdir distbin/

          for i in ./artifacts/* 
          do
              if [ -d "$i" ]
              then
                  cp LICENSE* "$i"
                  cp README.md "$i"
                  chmod +x "$i/${{ env.BIN_NAME }}" 1>/dev/null 2>&1 || true
                  chmod +x "$i/${{ env.BIN_NAME }}.exe" 1>/dev/null 2>&1 || true
                  tar -cvpzf "${i}.tar.gz" --directory=${i} .
              fi
          done
          cp artifacts/${{ env.BIN_NAME }}-*.tar.gz distbin/

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          # draft: true
          make_latest: true
          files: distbin/*
          token: ${{ secrets.RELEASE_TOKEN }}
          
          
