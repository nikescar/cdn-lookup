name: release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  RUST_VERSION: 1.86.0
  BIN_NAME: "cdn-lookup"

jobs:
  build:
    name: Build - ${{ matrix.platform.name }}
    # By default, runs on Ubuntu, otherwise, override with the desired os
    runs-on: ${{ matrix.platform.os || 'ubuntu-22.04' }}
    strategy:
      matrix:
        # Set platforms you want to build your binaries on
        platform:
          # Linux
          - name: Linux x86_64
            target: x86_64-unknown-linux-musl
            build-args: "--release"

          - name: Linux x86
            target: i686-unknown-linux-musl
            build-args: "--release"

          - name: Linux aarch64
            target: aarch64-unknown-linux-musl
            build-args: "--release"

          - name: Android aarch64
            target: aarch64-linux-android
            build-args: "--release"

          #- name: Linux mips
          #  target: mips-unknown-linux-musl

          #- name: Linux mips64
          #  target: mips64-unknown-linux-muslabi64

          # Mac OS
          - name: MacOS x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            build-args: "--release"

          # - name: MacOS aarch64
          #  os: macos-latest
          #  target: aarch64-apple-darwin
          #  build-args: "--release"

          # - name: iOS x86_64
          #   target: x86_64-apple-ios


          #- name: iOS aarch64
          #  target: aarch64-apple-ios


          # Windows
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            build-args: "--profile release-with-symbols"

          - name: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            build-args: "--profile release-with-symbols"

    steps:
      - name: Install package for linux
        if: contains(matrix.platform.target, 'linux')
        run: sudo apt install musl-tools

      - name: Install package for Android
        if: contains(matrix.platform.target, 'android')
        run: sudo apt install android-libunwind android-libunwind-dev  libunwind-dev

      - name: Set up JDK 17
        if: contains(matrix.platform.target, 'android')
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: contains(matrix.platform.target, 'android')
        uses: android-actions/setup-android@v4.0.4

      - name: Checkout Git repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Linux & Windows
      - name: Install rust toolchain for Linux
        uses: actions-rs/toolchain@v1
        with:
          # We setup Rust toolchain and the desired target
          profile: minimal
          toolchain: "${{ env.RUST_VERSION }}"
          override: true
          target: ${{ matrix.platform.target }}
          components: rustfmt, clippy

      - name: Install package for Android
        if: contains(matrix.platform.target, 'android')
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Show command used for Cargo
        run: |
          echo "cargo command is: ${{ env.CARGO }}"
          echo "target flag is: ${{ env.BUILD_ARGS }}"

      - name: Build ${{ matrix.platform.name }} binary
        uses: actions-rs/cargo@v1
        # We use cross-rs if not running on x86_64 architecture on Linux
        with:
          command: build
          use-cross: ${{ !contains(matrix.platform.target, 'x86_64') || contains(matrix.platform.target, 'freebsd') }}
          args: ${{ matrix.platform.build-args }} --package ${{ env.BIN_NAME }} --target ${{ matrix.platform.target }}

      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          # Finally, we store the binary as GitHub artifact for later usage
          name: ${{ env.BIN_NAME }}-${{ matrix.platform.target }}
          path: target/${{ matrix.platform.target }}/release${{ contains(matrix.platform.target, 'windows') && '-with-symbols' || '' }}/${{ env.BIN_NAME }}${{ contains(matrix.platform.target, 'windows') && '.exe' || '' }}
          retention-days: 1

  build-freebsd:
    name: Build - FreeBSD x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build x86_64-FreeBSD
        uses: cross-platform-actions/action@master
        with:
          operating_system: freebsd
          architecture: x86-64
          version: '15.1'
          shell: bash
          memory: 5G
          cpu_count: 4
          run: |
            sudo pkg install -y git
            curl --proto 'https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env
            export CARGO_TERM_COLOR=always
            cargo build --release --package ${{ env.BIN_NAME }}

      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-x86_64-unknown-freebsd
          path: target/release/${{ env.BIN_NAME }}
          retention-days: 1

  build-openbsd:
    name: Build - OpenBSD x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build x86_64-OpenBSD
        uses: cross-platform-actions/action@master
        with:
          operating_system: openbsd
          architecture: x86-64
          version: '8.0'
          shell: bash
          memory: 5G
          cpu_count: 4
          run: |
            sudo pkg_add rust git
            export CARGO_TERM_COLOR=always
            cargo build --release --package ${{ env.BIN_NAME }}

      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-x86_64-unknown-openbsd
          path: target/release/${{ env.BIN_NAME }}
          retention-days: 1

  build-netbsd:
    name: Build - NetBSD x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build x86_64-NetBSD
        uses: cross-platform-actions/action@master
        with:
          operating_system: netbsd
          architecture: x86-64
          version: '11.0'
          shell: bash
          memory: 5G
          cpu_count: 4
          run: |
            sudo pkgin -y install git curl clang
            curl --proto 'https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
            export CC=clang
            export CXX=clang++
            export CARGO_TERM_COLOR=always
            cargo build --release --package ${{ env.BIN_NAME }}

      - name: Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-x86_64-unknown-netbsd
          path: target/release/${{ env.BIN_NAME }}
          retention-days: 1

  release:
    name: Release
    needs: [ build, build-freebsd, build-openbsd, build-netbsd ]
    # We run the release job only if a tag starts with 'v' letter
    if: startsWith( github.ref, 'refs/tags/v' )
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Git repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Download all artifacts
      - uses: actions/download-artifact@v4.1.7
        with:
          path: artifacts

      - name: Debug - List Downloaded Artifacts
        run: |
          echo "=== Artifact directory structure ==="
          find artifacts -type f -ls 2>/dev/null || true
          echo ""
          echo "=== Checking files for VirusTotal scan ==="
          MISSING=0
          FOUND=0
          for file in \
            ./artifacts/${{ env.BIN_NAME }}-x86_64-unknown-linux-musl/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-i686-unknown-linux-musl/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-aarch64-unknown-linux-musl/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-aarch64-linux-android/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-x86_64-apple-darwin/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-x86_64-pc-windows-msvc/${{ env.BIN_NAME }}.exe \
            ./artifacts/${{ env.BIN_NAME }}-i686-pc-windows-msvc/${{ env.BIN_NAME }}.exe \
            ./artifacts/${{ env.BIN_NAME }}-x86_64-unknown-freebsd/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-x86_64-unknown-openbsd/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-x86_64-unknown-netbsd/${{ env.BIN_NAME }}; do
            if [ -f "$file" ]; then
              echo "✓ Found: $file ($(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "unknown") bytes)"
              FOUND=$((FOUND + 1))
            else
              echo "✗ Missing: $file"
              MISSING=$((MISSING + 1))
            fi
          done
          echo ""
          echo "Summary: $FOUND found, $MISSING missing"
          if [ $MISSING -gt 0 ]; then
            echo "⚠️ Warning: Some build artifacts are missing. Check build job logs."
          fi

      - name: Setup Python for VirusTotal Scan
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests

      - name: VirusTotal Scan
        id: vt_scan
        continue-on-error: true
        env:
          VT_REQUEST_RATE: 4
        run: |
          python .github/scripts/virustotal_scan.py \
            "${{ secrets.VT_API_KEY }}" \
            ./artifacts/${{ env.BIN_NAME }}-x86_64-unknown-linux-musl/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-i686-unknown-linux-musl/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-aarch64-unknown-linux-musl/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-aarch64-linux-android/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-x86_64-apple-darwin/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-x86_64-pc-windows-msvc/${{ env.BIN_NAME }}.exe \
            ./artifacts/${{ env.BIN_NAME }}-i686-pc-windows-msvc/${{ env.BIN_NAME }}.exe \
            ./artifacts/${{ env.BIN_NAME }}-x86_64-unknown-freebsd/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-x86_64-unknown-openbsd/${{ env.BIN_NAME }} \
            ./artifacts/${{ env.BIN_NAME }}-x86_64-unknown-netbsd/${{ env.BIN_NAME }}

      - name: Parse Analysis Results
        id: parse_results
        run: |
          # Auto-generate changelog from git commits between tags
          CHANGELOG_CONTENT=""

          echo "Generating changelog from git history..."

          # Get previous tag (fallback to first commit if no previous tag)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          CURRENT_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "HEAD")

          echo "Commits between $PREVIOUS_TAG and $CURRENT_TAG:"

          # Get all commits between tags, excluding merges
          ALL_COMMITS=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s" --no-merges | \
            sed -E 's/ \(#[0-9]+\)$//g' | \
            awk '!seen[$0]++')

          if [ -n "$ALL_COMMITS" ]; then
            # Group commits by type
            FEATURES=$(echo "$ALL_COMMITS" | grep -E "^- (feat|feature)" || echo "")
            FIXES=$(echo "$ALL_COMMITS" | grep -E "^- fix" || echo "")
            CHORES=$(echo "$ALL_COMMITS" | grep -E "^- (chore|ci|docs|refactor|perf|test|style)" || echo "")
            OTHER=$(echo "$ALL_COMMITS" | grep -vE "^- (feat|feature|fix|chore|ci|docs|refactor|perf|test|style)" || echo "")

            # Build formatted changelog
            if [ -n "$FEATURES" ]; then
              CHANGELOG_CONTENT="${CHANGELOG_CONTENT}### ✨ Features\n${FEATURES}\n\n"
            fi

            if [ -n "$FIXES" ]; then
              CHANGELOG_CONTENT="${CHANGELOG_CONTENT}### 🐛 Bug Fixes\n${FIXES}\n\n"
            fi

            if [ -n "$CHORES" ]; then
              CHANGELOG_CONTENT="${CHANGELOG_CONTENT}### 🔧 Maintenance\n${CHORES}\n\n"
            fi

            if [ -n "$OTHER" ]; then
              CHANGELOG_CONTENT="${CHANGELOG_CONTENT}### 📦 Other Changes\n${OTHER}\n\n"
            fi

            echo "Generated changelog:"
            echo -e "$CHANGELOG_CONTENT"
          else
            echo "No commits found between tags"
            CHANGELOG_CONTENT="No changes recorded."
          fi

          # Get the analysis output from previous step
          ANALYSIS="${{ steps.vt_scan.outputs.analysis }}"

          echo "Raw analysis output:"
          echo "$ANALYSIS"

          # Parse the analysis output and format for release notes
          # Format: file1=url1,file2=url2,...

          VT_RESULTS=""

          # Check if we have any results
          VT_SCAN_COUNT=0
          if [ -z "$ANALYSIS" ]; then
            echo "Warning: No analysis output from VirusTotal scan"
            VT_RESULTS="⚠️ VirusTotal scan encountered errors. Some files may have been scanned previously (409 error)."
          else
            # Split by comma and process each entry
            IFS=',' read -ra ENTRIES <<< "$ANALYSIS"
            for entry in "${ENTRIES[@]}"; do
              # Skip empty entries
              if [ -z "$entry" ]; then
                continue
              fi

              # Split by = to get file and URL
              IFS='=' read -r file url <<< "$entry"

              # Skip if file or url is empty
              if [ -z "$file" ] || [ -z "$url" ]; then
                continue
              fi

              # Extract identifier from path
              # For .exe files, use the filename
              # For other files (binaries), use the parent directory name which contains platform info
              if [[ "$file" == *.exe ]]; then
                identifier=$(basename "$file")
              else
                identifier=$(basename "$(dirname "$file")")
              fi

              # Build markdown link
              VT_RESULTS="${VT_RESULTS}- **${identifier}**: [View VirusTotal Report](${url})\n"
              VT_SCAN_COUNT=$((VT_SCAN_COUNT + 1))
            done

            # Check if we have formatted results
            if [ -z "$VT_RESULTS" ]; then
              echo "Warning: No valid results to format"
              VT_RESULTS="⚠️ No scan results available. Files may have been scanned recently."
            fi
          fi

          # Combine changelog and VirusTotal results
          FORMATTED_RESULTS=""

          if [ -n "$CHANGELOG_CONTENT" ]; then
            FORMATTED_RESULTS="${FORMATTED_RESULTS}## What's Changed\n${CHANGELOG_CONTENT}\n"
          fi

          # Add VirusTotal section with scan count
          if [ $VT_SCAN_COUNT -gt 0 ]; then
            FORMATTED_RESULTS="${FORMATTED_RESULTS}## VirusTotal Scan Results\n\n"
            FORMATTED_RESULTS="${FORMATTED_RESULTS}✅ **${VT_SCAN_COUNT} files scanned**\n\n"
            FORMATTED_RESULTS="${FORMATTED_RESULTS}${VT_RESULTS}"
          else
            FORMATTED_RESULTS="${FORMATTED_RESULTS}## VirusTotal Scan Results\n\n${VT_RESULTS}"
          fi

          # Save to output (escape for GitHub Actions)
          echo "formatted_results<<EOF" >> $GITHUB_OUTPUT
          echo -e "$FORMATTED_RESULTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Formatted results:"
          echo -e "$FORMATTED_RESULTS"

      - name: Prepare Release Artifacts
        run: |
          find artifacts/
          mkdir distbin/

          for i in ./artifacts/*
          do
              if [ -d "$i" ]
              then
                  # Handle Windows executables - keep as-is, no tar.gz
                  if [[ "$i" == *"windows"* ]]; then
                      cp "$i"/${{ env.BIN_NAME }}.exe distbin/$(basename "$i").exe 2>/dev/null || true
                      continue
                  fi

                  # Handle other platforms - tar compress
                  cp LICENSE* "$i" 2>/dev/null || true
                  cp README.md "$i" 2>/dev/null || true
                  chmod +x "$i/${{ env.BIN_NAME }}" 1>/dev/null 2>&1 || true
                  tar -cvpzf "${i}.tar.gz" --directory=${i} .
              fi
          done
          cp artifacts/*.tar.gz distbin/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          # draft: true
          make_latest: true
          files: distbin/*
          body: ${{ steps.parse_results.outputs.formatted_results }}
          
          
